<svg xmlns="http://www.w3.org/2000/svg" width="772" height="250" viewBox="0 0 772 250">
  <!-- Dark background matching original -->
  <rect width="772" height="250" fill="#2d2d2d"/>
  
  <!-- Plugin name - large white text, left aligned -->
  <text x="50" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Oli Media Cleaner
  </text>
  
  <!-- Tagline - smaller, slightly muted -->
  <text x="50" y="150" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#b0b0b0" letter-spacing="0.3">
    Automated Media Library Cleanup &amp; Storage Optimization
  </text>
  
  <!-- Image icon (photos/gallery) - thin line art -->
  <g transform="translate(555, 65)" fill="none" stroke="#c0c0c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Frame -->
    <rect x="0" y="0" width="56" height="48" rx="4"/>
    <!-- Mountain/landscape -->
    <polyline points="0,38 16,24 28,36 36,28 56,42"/>
    <!-- Sun -->
    <circle cx="42" cy="16" r="6"/>
  </g>
  
  <!-- Arrow -->
  <g transform="translate(625, 80)" fill="none" stroke="#888888" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="8" x2="28" y2="8"/>
    <polyline points="20,0 28,8 20,16"/>
  </g>
  
  <!-- Trash/recycle icon - thin line art -->
  <g transform="translate(668, 58)" fill="none" stroke="#c0c0c0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lid -->
    <line x1="2" y1="12" x2="54" y2="12"/>
    <path d="M18,12 L18,6 Q18,2 22,2 L34,2 Q38,2 38,6 L38,12"/>
    <!-- Can body -->
    <path d="M6,12 L10,54 Q10,58 14,58 L42,58 Q46,58 46,54 L50,12"/>
    <!-- Lines inside -->
    <line x1="22" y1="22" x2="22" y2="48"/>
    <line x1="34" y1="22" x2="34" y2="48"/>
    <!-- X mark for deletion -->
    <g transform="translate(36, 42)" stroke="#c0c0c0" stroke-width="3">
      <circle cx="12" cy="12" r="14" fill="#2d2d2d" stroke="#c0c0c0" stroke-width="2.5"/>
      <line x1="5" y1="5" x2="19" y2="19"/>
      <line x1="19" y1="5" x2="5" y2="19"/>
    </g>
  </g>
</svg>
