name: Build Release ZIP

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create clean plugin directory
        run: |
          mkdir -p build/oli-media-cleaner
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='node_modules' \
            --exclude='.idea' \
            --exclude='.vscode' \
            --exclude='tests' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='*Zone.Identifier' \
            ./ build/oli-media-cleaner/

      - name: Create ZIP
        run: |
          cd build
          zip -r ../oli-media-cleaner.zip oli-media-cleaner/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: oli-media-cleaner.zip
          generate_release_notes: true
